version: '3.8'

services:
  mongodb:
    image: mongo:6-alpine
    container_name: devdop-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: devdop-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/devdop
      - JWT_SECRET=change_me_super_secret_production_key_32chars
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
    depends_on:
      - mongodb
    restart: always

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: devdop-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  mongo-data:
